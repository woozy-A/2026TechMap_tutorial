<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">완료한 코드를 실제 기기로</title>
  <desc id="desc">Main Sections 1~4를 완료한 프로젝트에서 LiDAR 기기를 연결하고 Xcode 실행 대상을 변경합니다. Team 서명을 확인한 뒤 실행합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">완료한 코드를 실제 기기로</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="125" width="402" height="422" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="76" y="172" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">계속 사용할 프로젝트</text>
    <rect x="105" y="220" width="278" height="178" rx="12" fill="#eaf3ff" stroke="#647c96" stroke-width="3"/>
    <path d="M76 415H412L381 398H107Z" fill="#c5d1de"/>
    <text x="130" y="267" font-size="23" fill="#33465c" font-weight="400" text-anchor="start">Main Sections 1~4</text>
    <text x="130" y="302" font-size="23" fill="#33465c" font-weight="400" text-anchor="start">목록 · 선택 · box</text>
    <text x="130" y="337" font-size="23" fill="#33465c" font-weight="400" text-anchor="start">Highlight 완료</text>
    <text x="244" y="488" font-size="23" fill="#0060c0" font-weight="600" text-anchor="middle">새 Starter로 돌아가지 않기</text>
    <path d="M464 314H514" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="534" y="125" width="422" height="422" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="570" cy="174" r="21" fill="#0071e3"/>
    <text x="570" y="182" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">1</text>
    <text x="605" y="184" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">LiDAR 기기 연결</text>
    <circle cx="570" cy="266" r="21" fill="#0071e3"/>
    <text x="570" y="274" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">2</text>
    <text x="605" y="268" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Xcode 실행 대상 변경</text>
    <text x="605" y="303" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Simulator → 내 기기</text>
    <circle cx="570" cy="372" r="21" fill="#0071e3"/>
    <text x="570" y="380" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">3</text>
    <text x="605" y="374" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Team · 서명 확인</text>
    <text x="605" y="409" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Command-R로 실행</text>
    <text x="566" y="505" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">기기의 개발자 모드·신뢰 안내 확인</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">실기기가 없으면 Challenge를 건너뛰어도 괜찮습니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">설치·서명 단계의 오류는 아직 RoomPlan 스캔 결과가 아닙니다.</text>
  </g>
</svg>
