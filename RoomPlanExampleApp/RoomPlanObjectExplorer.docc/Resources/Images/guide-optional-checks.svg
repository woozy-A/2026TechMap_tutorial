<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">필수 완료와 추가 실험</title>
  <desc id="desc">목록과 box와 선택 Highlight가 필수입니다. Main Section5를 완료하고 mapping한 category가 실제 인식된 경우에만 USDZ 교체를 시험하고 Bonus를 완료했을 때 회전을 추가합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">필수 완료와 추가 실험</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="126" width="912" height="111" rx="18" fill="#e9f5f0" stroke="none" stroke-width="2"/>
    <text x="77" y="171" font-size="27" fill="#17664f" font-weight="650" text-anchor="start">필수 완료</text>
    <text x="77" y="210" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">내 방의 목록 + box + 같은 객체의 Highlight</text>
    <path d="M500 246V278" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="44" y="299" width="436" height="246" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="76" y="344" font-size="26" fill="#0060c0" font-weight="600" text-anchor="start">추가 1 · USDZ 교체</text>
    <text x="76" y="393" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Section 5 완료</text>
    <text x="76" y="428" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">mapping한 category가 인식됨</text>
    <text x="76" y="463" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">→ Replace with 3D Model</text>
    <path d="M489 420H520" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="536" y="299" width="420" height="246" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="568" y="344" font-size="26" fill="#0060c0" font-weight="600" text-anchor="start">추가 2 · 90° 회전</text>
    <text x="568" y="393" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Bonus 완료</text>
    <text x="568" y="428" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">선택한 객체가 model로 교체됨</text>
    <text x="568" y="463" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">→ Rotate 90°</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">Chair가 인식되지 않아도 필수 Challenge 실패는 아닙니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">추가 기능은 구현 상태와 실제 스캔 category가 맞을 때만 확인합니다.</text>
  </g>
</svg>
