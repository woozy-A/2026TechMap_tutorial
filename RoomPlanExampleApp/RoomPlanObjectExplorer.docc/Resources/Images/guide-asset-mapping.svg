<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">방법 B · 이름을 연결</title>
  <desc id="desc">category가 가리키는 resourceName과 프로젝트에 포함된 USDZ 파일 이름을 일치시킵니다. 확장자는 resourceName에 넣지 않습니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
