    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <text x="66" y="157" font-size="24" fill="#515d6b" font-weight="600" text-anchor="start">category</text>
    <text x="338" y="157" font-size="24" fill="#515d6b" font-weight="600" text-anchor="start">resourceName</text>
    <text x="710" y="157" font-size="24" fill="#515d6b" font-weight="600" text-anchor="start">Resources의 파일</text>
    <rect x="48" y="190" width="208" height="77" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="71" y="237" font-size="28" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">.chair</text>
    <path d="M272 229H310" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
