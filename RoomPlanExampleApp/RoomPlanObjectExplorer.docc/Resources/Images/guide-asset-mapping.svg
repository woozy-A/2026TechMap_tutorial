    <text x="71" y="355" font-size="28" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">.bed</text>
    <path d="M272 347H310" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="329" y="308" width="267" height="77" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="350" y="355" font-size="26" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">"Bed"</text>
