<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">실습의 시작점 찾기</title>
  <desc id="desc">실습 ZIP의 Starter 프로젝트를 열고 iPhone Simulator로 실행한 후 Start Part 1 안내를 확인합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">실습의 시작점 찾기</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="116" width="440" height="422" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="72" y="166" font-size="27" fill="#0071e3" font-weight="600" text-anchor="start">Project files · 압축 풀기</text>
    <text x="72" y="228" font-size="21" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">RoomPlanTutorialMaterials-v2.7/</text>
    <text x="72" y="261" font-size="21" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">├ Starter/</text>
    <text x="72" y="294" font-size="21" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">│  └ RoomPlanExampleApp.xcodeproj</text>
    <text x="72" y="327" font-size="21" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">└ Assets/Chair.usdz</text>
    <rect x="67" y="374" width="393" height="126" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="88" y="411" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">지금 열 것: Starter의 프로젝트</text>
    <text x="88" y="446" font-size="23" fill="#1d1d1f" font-weight="400" text-anchor="start">Assets는 Section 5에서 사용</text>
    <path d="M491 325H522" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="540" y="116" width="416" height="422" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="577" cy="157" r="21" fill="#0071e3"/>
    <text x="577" y="165" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">1</text>
    <text x="610" y="166" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">iPhone Simulator</text>
    <text x="568" y="228" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">RoomPlanExampleApp scheme</text>
    <rect x="568" y="266" width="360" height="66" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="748" y="309" font-size="26" fill="#0060c0" font-weight="600" text-anchor="middle">Command-R · 실행</text>
    <path d="M748 341V371" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="748" y="413" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="middle">Explore Sample Room</text>
    <text x="748" y="475" font-size="23" fill="#515d6b" font-weight="400" text-anchor="middle">Start Part 1 → OK → 실행 중지</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">첫 안내가 보이면 준비 완료입니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">기존 완성본이 아니라 Starter에서 시작합니다.</text>
  </g>
</svg>
