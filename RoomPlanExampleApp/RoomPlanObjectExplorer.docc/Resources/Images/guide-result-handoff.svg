<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">데이터 전달과 화면 전환</title>
  <desc id="desc">설명용 도식이며 실제 캡처가 아닙니다. didPresent가 받은 CapturedRoom을 configure에 전달한 다음 setViewControllers가 스캔 화면을 기존 Object Explorer로 바꿉니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650">데이터 전달과 화면 전환</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6"/>
    <text x="808" y="57" font-size="19" fill="#33465c" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="126" width="912" height="182" rx="18" fill="#fff"/>
    <text x="74" y="170" font-size="27" fill="#0071e3" font-weight="650">01 · 데이터를 전달합니다</text>
    <text x="74" y="228" font-size="25" fill="#1d1d1f">processedResult: CapturedRoom</text>
    <path d="M445 218H507" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="536" y="227" font-size="25" fill="#1d1d1f">explorer.configure(with: …)</text>
    <text x="74" y="279" font-size="23" fill="#515d6b">처리된 방 결과를 기존 Explorer에 저장</text>
    <path d="M500 318V356" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="44" y="376" width="912" height="182" rx="18" fill="#eaf3ff"/>
    <text x="74" y="420" font-size="27" fill="#0071e3" font-weight="650">02 · 화면을 전환합니다</text>
    <text x="74" y="478" font-size="27" fill="#1d1d1f">스캔 화면</text>
    <path d="M250 468H316" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="478" font-size="27" fill="#1d1d1f">Object Explorer</text>
    <text x="74" y="530" font-size="23" fill="#515d6b">setViewControllers([explorer], animated: true)</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" font-weight="600" fill="#1d1d1f">두 줄은 역할이 다릅니다. 데이터 연결 → 화면 열기.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b">Explorer가 열리면 Main에서 만든 목록 · box · Highlight 코드가 실행됩니다.</text>
  </g>
</svg>
