<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Done 이후에 일어나는 일</title>
  <desc id="desc">Done 버튼은 스캔을 종료하고 처리 중 표시를 시작합니다. RoomPlan은 CapturedRoomData를 처리한 뒤 didPresent 콜백으로 최종 CapturedRoom을 전달합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">Done 이후에 일어나는 일</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <circle cx="79" cy="167" r="21" fill="#0071e3"/>
    <text x="79" y="175" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">01</text>
    <rect x="124" y="128" width="832" height="84" rx="18" fill="#fff" stroke="none" stroke-width="2"/>
    <text x="153" y="163" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">Done · 스캔 종료</text>
    <text x="153" y="194" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">stopSession()</text>
    <path d="M78 194V233" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="79" cy="279" r="21" fill="#0071e3"/>
    <text x="79" y="287" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">02</text>
    <rect x="124" y="240" width="832" height="84" rx="18" fill="#fff" stroke="none" stroke-width="2"/>
    <text x="153" y="275" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">처리 전 데이터 · 허용</text>
    <text x="153" y="306" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">shouldPresent → true</text>
    <path d="M78 306V345" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="79" cy="391" r="21" fill="#0071e3"/>
    <text x="79" y="399" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">03</text>
    <rect x="124" y="352" width="832" height="84" rx="18" fill="#fff" stroke="none" stroke-width="2"/>
    <text x="153" y="387" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">RoomPlan 결과 처리</text>
    <text x="153" y="418" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start">기다리는 동안 처리 중 표시</text>
    <path d="M78 418V457" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="79" cy="503" r="21" fill="#0071e3"/>
    <text x="79" y="511" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">04</text>
    <rect x="124" y="464" width="832" height="84" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="153" y="499" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">최종 CapturedRoom</text>
    <text x="153" y="530" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">didPresent → Explorer</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">Done이 Explorer를 즉시 여는 것은 아닙니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">처리 전 CapturedRoomData와 처리된 CapturedRoom을 구별하세요.</text>
  </g>
</svg>
