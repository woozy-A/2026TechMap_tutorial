<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Chair.usdz를 앱에 넣기</title>
  <desc id="desc">Assets 폴더의 Chair.usdz를 Xcode 프로젝트 Resources로 끌어 놓고 복사와 앱 target을 확인합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">Chair.usdz를 앱에 넣기</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <circle cx="76" cy="148" r="21" fill="#0071e3"/>
    <text x="76" y="156" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">1</text>
    <text x="110" y="157" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">압축 안의 Assets</text>
    <path d="M148 202h90l34 34v108h-124z" fill="#e5f1ff" stroke="#0071e3" stroke-width="2"/>
    <path d="M238 202v34h34" fill="none" stroke="#0071e3" stroke-width="2"/>
    <text x="210" y="289" font-size="25" fill="#0060c0" font-weight="650" text-anchor="middle">USDZ</text>
    <text x="210" y="384" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="middle">Chair.usdz</text>
    <path d="M350 296H486" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="419" y="257" font-size="23" fill="#0060c0" font-weight="500" text-anchor="middle">끌어 놓기</text>
    <rect x="522" y="121" width="434" height="422" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="557" cy="156" r="21" fill="#0071e3"/>
    <text x="557" y="164" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">2</text>
    <text x="590" y="166" font-size="26" fill="#1d1d1f" font-weight="600" text-anchor="start">Xcode · Resources</text>
    <text x="550" y="226" font-size="23" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">RoomPlanExampleApp</text>
    <text x="550" y="261" font-size="23" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">  └ Resources</text>
    <text x="550" y="296" font-size="23" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">     └ Chair.usdz</text>
    <rect x="550" y="366" width="25" height="25" rx="5" fill="#0071e3"/>
    <path d="M555 378l5 5 10-13" stroke="#fff" stroke-width="3" fill="none"/>
    <text x="589" y="388" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">Copy items if needed</text>
    <rect x="550" y="418" width="25" height="25" rx="5" fill="#0071e3"/>
    <path d="M555 430l5 5 10-13" stroke="#fff" stroke-width="3" fill="none"/>
    <text x="589" y="440" font-size="24" fill="#1d1d1f" font-weight="400" text-anchor="start">RoomPlanExampleApp target</text>
    <text x="550" y="502" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start">File Inspector에서도 소속 확인</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">확인: 이름은 Chair.usdz, 앱 target에 포함되어야 합니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">코드 입력이 아니라, 파일을 앱 bundle에 넣는 작업입니다.</text>
  </g>
</svg>
