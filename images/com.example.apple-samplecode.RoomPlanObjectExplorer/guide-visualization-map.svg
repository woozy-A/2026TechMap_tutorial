<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">데이터와 box를 연결하기</title>
  <desc id="desc">dimensions는 크기, transform은 위치와 방향, identifier는 선택한 box의 Highlight에 연결됩니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">데이터와 box를 연결하기</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <text x="76" y="144" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">CapturedRoom.Object</text>
    <text x="603" y="144" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">RealityKit 표현</text>
    <rect x="60" y="177" width="351" height="82" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="90" y="228" font-size="29" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">dimensions</text>
    <path d="M425 218H565" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="586" y="177" width="353" height="82" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="762" y="228" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="middle">box 크기</text>
    <rect x="60" y="299" width="351" height="82" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="90" y="350" font-size="29" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">transform</text>
    <path d="M425 340H565" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="586" y="299" width="353" height="82" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="762" y="350" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="middle">위치 · 방향</text>
    <rect x="60" y="421" width="351" height="82" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="90" y="472" font-size="29" fill="#0060c0" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,monospace">identifier</text>
    <path d="M425 462H565" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="586" y="421" width="353" height="82" rx="18" fill="#fce8f0" stroke="none" stroke-width="2"/>
    <text x="762" y="472" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="middle">같은 UUID → Highlight</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">선택이 바뀌어도 box의 크기와 위치는 유지됩니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">Recap의 두 함수: renderObjectBoxes() · updateHighlight()</text>
  </g>
</svg>
