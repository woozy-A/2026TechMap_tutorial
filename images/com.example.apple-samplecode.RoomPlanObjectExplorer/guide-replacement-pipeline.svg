<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">교체 코드의 네 단계</title>
  <desc id="desc">USDZ를 기다린 후 선택 UUID를 재확인하고 같은 객체라면 장면의 box를 모델로 교체한 다음 참조와 상태를 갱신합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">교체 코드의 네 단계</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="120" width="426" height="181" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="78" cy="159" r="21" fill="#0071e3"/>
    <text x="78" y="167" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">1</text>
    <text x="112" y="168" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">모델 불러오기</text>
    <text x="74" y="224" font-size="24" fill="#33465c" font-weight="400" text-anchor="start">try await makeModel(…)</text>
    <text x="74" y="260" font-size="24" fill="#33465c" font-weight="400" text-anchor="start">로딩 · 크기 맞춤</text>
    <path d="M482 211H516" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="534" y="120" width="422" height="181" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="568" cy="159" r="21" fill="#0071e3"/>
    <text x="568" y="167" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">2</text>
    <text x="602" y="168" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">선택 재확인</text>
    <text x="564" y="224" font-size="24" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">selectedObjectID</text>
    <text x="564" y="260" font-size="24" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">== identifier ?</text>
    <path d="M744 310V358" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="778" y="340" font-size="22" fill="#0060c0" font-weight="600" text-anchor="start">같을 때만</text>
    <rect x="534" y="376" width="422" height="181" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="568" cy="415" r="21" fill="#0071e3"/>
    <text x="568" y="423" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">3</text>
    <text x="602" y="424" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">장면 바꾸기</text>
    <text x="564" y="480" font-size="23" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">removeFromParent()</text>
    <text x="564" y="515" font-size="23" fill="#33465c" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">objectRoot.addChild(…)</text>
    <path d="M519 466H483" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="44" y="376" width="426" height="181" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <circle cx="78" cy="415" r="21" fill="#0071e3"/>
    <text x="78" y="423" font-size="24" fill="#fff" font-weight="600" text-anchor="middle">4</text>
    <text x="112" y="424" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">참조 · 상태 갱신</text>
    <text x="74" y="480" font-size="24" fill="#33465c" font-weight="400" text-anchor="start">같은 UUID → 새 Entity</text>
    <text x="74" y="516" font-size="24" fill="#33465c" font-weight="400" text-anchor="start">교체 상태와 문구 갱신</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">장면 변경과 dictionary 저장은 서로 다른 일입니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">선택이 달라지면 중단 · 로딩 실패는 Starter의 호출부에서 안내합니다.</text>
  </g>
</svg>
