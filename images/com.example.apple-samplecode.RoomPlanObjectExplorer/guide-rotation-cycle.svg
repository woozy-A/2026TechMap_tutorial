<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">같은 모델을 90°씩 회전</title>
  <desc id="desc">네 번의 클릭에 0, 90, 180, 270, 다시 0도로 돌아옵니다. 원래 transform에서 local Y축 회전만 합성하며 위치와 선택 UUID를 유지합니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">같은 모델을 90°씩 회전</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <text x="500" y="144" font-size="25" fill="#515d6b" font-weight="500" text-anchor="middle">local +Y축 위에서 본 방향 · 반시계 방향</text>
    <circle cx="146" cy="306" r="87" fill="#eaf3ff" stroke="#c3d8ef" stroke-width="2"/>
    <circle cx="146" cy="306" r="4" fill="#0071e3"/>
    <g transform="translate(146 306) rotate(0)">
      <rect x="-34" y="-36" width="68" height="74" rx="12" fill="#84b8c9"/>
      <path d="M-43-43H43" stroke="#33465c" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 4V-27" stroke="#fff" stroke-width="4"/>
      <path d="M-8-19L0-29L8-19" stroke="#fff" stroke-width="4" fill="none"/>
    </g>
    <text x="146" y="442" font-size="30" fill="#1d1d1f" font-weight="600" text-anchor="middle">0°</text>
    <path d="M242 306H281" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="382" cy="306" r="87" fill="#eaf3ff" stroke="#c3d8ef" stroke-width="2"/>
    <circle cx="382" cy="306" r="4" fill="#0071e3"/>
    <g transform="translate(382 306) rotate(-90)">
      <rect x="-34" y="-36" width="68" height="74" rx="12" fill="#84b8c9"/>
      <path d="M-43-43H43" stroke="#33465c" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 4V-27" stroke="#fff" stroke-width="4"/>
      <path d="M-8-19L0-29L8-19" stroke="#fff" stroke-width="4" fill="none"/>
    </g>
    <text x="382" y="442" font-size="30" fill="#1d1d1f" font-weight="600" text-anchor="middle">90°</text>
    <path d="M478 306H517" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="618" cy="306" r="87" fill="#eaf3ff" stroke="#c3d8ef" stroke-width="2"/>
    <circle cx="618" cy="306" r="4" fill="#0071e3"/>
    <g transform="translate(618 306) rotate(-180)">
      <rect x="-34" y="-36" width="68" height="74" rx="12" fill="#84b8c9"/>
      <path d="M-43-43H43" stroke="#33465c" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 4V-27" stroke="#fff" stroke-width="4"/>
      <path d="M-8-19L0-29L8-19" stroke="#fff" stroke-width="4" fill="none"/>
    </g>
    <text x="618" y="442" font-size="30" fill="#1d1d1f" font-weight="600" text-anchor="middle">180°</text>
    <path d="M714 306H753" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="854" cy="306" r="87" fill="#eaf3ff" stroke="#c3d8ef" stroke-width="2"/>
    <circle cx="854" cy="306" r="4" fill="#0071e3"/>
    <g transform="translate(854 306) rotate(-270)">
      <rect x="-34" y="-36" width="68" height="74" rx="12" fill="#84b8c9"/>
      <path d="M-43-43H43" stroke="#33465c" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 4V-27" stroke="#fff" stroke-width="4"/>
      <path d="M-8-19L0-29L8-19" stroke="#fff" stroke-width="4" fill="none"/>
    </g>
    <text x="854" y="442" font-size="30" fill="#1d1d1f" font-weight="600" text-anchor="middle">270°</text>
    <path d="M854 460V517H146V460" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="500" y="505" font-size="25" fill="#0060c0" font-weight="600" text-anchor="middle">네 번째 클릭 → 원래 방향</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">위치와 선택 UUID는 그대로, 방향만 바뀝니다.</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">.pi / 2 = 90° · axis: [0, 1, 0] · % 4로 회전 횟수 순환</text>
  </g>
</svg>
