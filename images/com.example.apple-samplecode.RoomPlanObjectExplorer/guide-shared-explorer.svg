<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">입력은 둘 · Explorer는 하나</title>
  <desc id="desc">샘플 JSON과 실제 스캔이 각각 CapturedRoom을 얻고 같은 configure 함수로 기존 Explorer에 전달합니다. configure는 데이터 전달, setViewControllers는 화면 전환입니다. 설명용 도식이며 실제 앱이나 Xcode 캡처가 아닙니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#0071e3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">
    <text x="44" y="65" font-size="31" fill="#1d1d1f" font-weight="650" text-anchor="start">입력은 둘 · Explorer는 하나</text>
    <rect x="660" y="28" width="296" height="44" rx="22" fill="#e5edf6" stroke="none" stroke-width="2"/>
    <text x="808" y="57" font-size="19" fill="#33465c" font-weight="500" text-anchor="middle">설명용 도식 · 실제 캡처 아님</text>
    <rect x="44" y="124" width="400" height="131" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="76" y="167" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Main · Room.json</text>
    <text x="76" y="218" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">JSONDecoder → CapturedRoom</text>
    <rect x="556" y="124" width="400" height="131" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="588" y="167" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="start">Challenge · 실제 스캔</text>
    <text x="588" y="218" font-size="22" fill="#515d6b" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">didPresent → CapturedRoom</text>
    <path d="M244 267V294H480V327" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M756 267V294H520V327" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="184" y="345" width="632" height="80" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/>
    <text x="500" y="394" font-size="29" fill="#0060c0" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">explorer.configure(with: …)</text>
    <path d="M500 435V466" fill="none" stroke="#0071e3" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="184" y="485" width="632" height="67" rx="18" fill="#fff" stroke="#dce2e9" stroke-width="2"/>
    <text x="500" y="528" font-size="27" fill="#1d1d1f" font-weight="600" text-anchor="middle">같은 목록 · box · Highlight 코드</text>
    <path d="M44 580H956" stroke="#dce2e9" stroke-width="2"/>
    <text x="44" y="622" font-size="25" fill="#1d1d1f" font-weight="600" text-anchor="start">configure는 데이터 전달 · setViewControllers는 화면 전환</text>
    <text x="44" y="656" font-size="21" fill="#515d6b" font-weight="400" text-anchor="start">새 Explorer를 만들거나 별도의 JSON 파일로 저장할 필요가 없습니다.</text>
  </g>
</svg>
